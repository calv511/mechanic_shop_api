swagger: '2.0'
info:
  title: "Mechanic Shop API"
  description: >-
    A REST API for managing a mechanic shop. Customers can create accounts and
    service tickets, mechanics can manage assignments and inventory, and
    authenticated users can access resources based on their role. The API uses
    bearer JWT authentication.
  version: "1.0.0"
host: "127.0.0.1:5000"
schemes:
  - "http"
consumes:
  - "application/json"
produces:
  - "application/json"
securityDefinitions:
  customerBearer:
    type: "apiKey"
    name: "Authorization"
    in: "header"
    description: >-
      Customer JWT issued by POST /customers/login. Send it as
      `Authorization: Bearer <token>`. Tokens use HS256, expire after one hour,
      and contain the role claim `customer`.
  mechanicBearer:
    type: "apiKey"
    name: "Authorization"
    in: "header"
    description: >-
      Mechanic JWT issued by POST /mechanics/login. Send it as
      `Authorization: Bearer <token>`. Tokens use HS256, expire after one hour,
      and contain the role claim `mechanic`.
paths:
  /customers/:
    get:
      tags:
        - customers
      summary: "Get all customers"
      description: "Return a paginated list of customer accounts."
      security: []
      parameters:
        - in: "query"
          name: "page"
          type: "integer"
          format: "int32"
          default: 1
          minimum: 1
          description: "The page number to return."
        - in: "query"
          name: "per_page"
          type: "integer"
          format: "int32"
          default: 10
          minimum: 1
          maximum: 100
          description: "The number of customers per page."
      responses:
        "200":
          description: "Paginated list of customers"
          schema:
            $ref: "#/definitions/GetAllCustomersResponse"

    post:
      tags:
        - customers
      summary: "Create a customer"
      description: "Create a customer account with contact information and a password."
      security: []
      parameters:
        - in: "body"
          name: "body"
          description: "Information required to create a customer"
          required: true
          schema:
            $ref: "#/definitions/CreateCustomerPayload"
      responses:
        "201":
          description: "Customer created successfully"
          schema:
            $ref: "#/definitions/CreaterCustomerResponse"
        "400":
          description: "Invalid customer data or email already associated with an account"

    put:
      tags:
        - customers
      summary: "Update the authenticated customer's account"
      description: "Partially update the customer identified by the JWT subject."
      security:
        - customerBearer: []
      parameters:
        - in: "body"
          name: "body"
          description: "Customer fields to update"
          required: true
          schema:
            $ref: "#/definitions/CreateCustomerPayload"
      responses:
        "200":
          description: "Customer updated successfully"
          schema:
            $ref: "#/definitions/CreaterCustomerResponse"
        "400":
          description: "Missing, expired, invalid, or malformed bearer token, or invalid customer data"
        "404":
          description: "Customer not found"

    delete:
      tags:
        - customers
      summary: "Delete the authenticated customer's account"
      description: "Delete the customer identified by the JWT subject."
      security:
        - customerBearer: []
      responses:
        "200":
          description: "Customer deleted successfully"
        "400":
          description: "Missing, expired, or invalid bearer token"
        "404":
          description: "Customer not found"

  /customers/login:
    post:
      tags:
        - customers
      summary: "Authenticate a customer"
      description: "Authenticate a customer with an email address and password."
      security: []
      parameters:
        - in: "body"
          name: "body"
          description: "Customer login credentials"
          required: true
          schema:
            $ref: "#/definitions/LoginCredentials"
      responses:
        "200":
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
        "401":
          description: "Invalid email or password"

  /customers/my-tickets:
    get:
      tags:
        - customers
      summary: "Get the authenticated customer's service tickets"
      description: "Return service tickets belonging to the customer identified by the JWT subject."
      security:
        - customerBearer: []
      responses:
        "200":
          description: "Customer service tickets"
        "400":
          description: "Missing, expired, or invalid bearer token"

  /mechanics/login:
    post:
      tags:
        - mechanics
      summary: "Authenticate a mechanic"
      description: "Authenticate a mechanic with an email address and password."
      security: []
      parameters:
        - in: "body"
          name: "body"
          description: "Mechanic login credentials"
          required: true
          schema:
            $ref: "#/definitions/LoginCredentials"
      responses:
        "200":
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
        "401":
          description: "Invalid email or password"

definitions:
  GetAllCustomersResponse:
    type: "object"
    required:
      - "customers"
      - "page"
      - "per_page"
      - "total_pages"
      - "total_customers"
    properties:
      customers:
        type: "array"
        description: "Customers included in the requested page."
        items:
          $ref: "#/definitions/CreaterCustomerResponse"
      page:
        type: "integer"
        format: "int32"
        description: "The current page number."
      per_page:
        type: "integer"
        format: "int32"
        description: "The number of customers requested per page."
      total_pages:
        type: "integer"
        format: "int32"
        description: "The total number of available pages."
      total_customers:
        type: "integer"
        format: "int32"
        description: "The total number of customers."

  CreateCustomerPayload:
    type: "object"
    required:
      - "name"
      - "email"
      - "phone"
      - "password"
    properties:
      name:
        type: "string"
        description: "The customer's full name."
        example: "Alex Morgan"
      email:
        type: "string"
        format: "email"
        description: "The customer's email address."
        example: "alex.morgan@example.com"
      phone:
        type: "string"
        description: "The customer's phone number."
        example: "555-0100"
      password:
        type: "string"
        format: "password"
        description: "The password for the customer account."
        example: "secret123"

  CreaterCustomerResponse:
    type: "object"
    required:
      - "id"
      - "name"
      - "email"
      - "phone"
    properties:
      id:
        type: "integer"
        format: "int32"
        description: "The newly created customer's ID."
        example: 1
      name:
        type: "string"
        description: "The customer's full name."
      email:
        type: "string"
        format: "email"
        description: "The customer's email address."
      phone:
        type: "string"
        description: "The customer's phone number."

  LoginCredentials:
    type: "object"
    required:
      - "email"
      - "password"
    properties:
      email:
        type: "string"
        format: "email"
        description: "The account email address."
        example: "customer@example.com"
      password:
        type: "string"
        format: "password"
        description: "The account password."
        example: "secret123"

  LoginResponse:
    type: "object"
    required:
      - "status"
      - "message"
      - "token"
    properties:
      token:
        type: "string"
        description: "Bearer JWT to use for authenticated requests."
      message:
        type: "string"
        description: "Result message for the login request."
      status:
        type: "string"
        description: "Login result status."
        example: "success"