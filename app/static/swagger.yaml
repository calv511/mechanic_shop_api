swagger: '2.0'
info:
  title: "Mechanic Shop API"
  description: >-
    A REST API for managing a mechanic shop. Customers can create accounts and
    service tickets, mechanics can manage assignments and inventory, and
    authenticated users can access resources based on their role. The API uses
    bearer JWT authentication.
  version: "1.0.0"
host: "127.0.0.1:5000"
schemes:
  - "http"
consumes:
  - "application/json"
produces:
  - "application/json"
paths:
  /customers/:
    post:
      tags:
        - customers
      summary: "Create a customer"
      description: "Create a customer account with contact information and a password."
      parameters:
        - in: "body"
          name: "body"
          description: "Information required to create a customer"
          required: true
          schema:
            $ref: "#/definitions/CreateCustomerPayload"
      responses:
        "201":
          description: "Customer created successfully"
          schema:
            $ref: "#/definitions/CreaterCustomerResponse"
        "400":
          description: "Invalid customer data or email already associated with an account"

  /customers/login:
    post:
      tags:
        - customers
      summary: "Authenticate a customer"
      description: "Authenticate a customer with an email address and password."
      parameters:
        - in: "body"
          name: "body"
          description: "Customer login credentials"
          required: true
          schema:
            $ref: "#/definitions/LoginCredentials"
      responses:
        "200":
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
        "401":
          description: "Invalid email or password"

  /mechanics/login:
    post:
      tags:
        - mechanics
      summary: "Authenticate a mechanic"
      description: "Authenticate a mechanic with an email address and password."
      parameters:
        - in: "body"
          name: "body"
          description: "Mechanic login credentials"
          required: true
          schema:
            $ref: "#/definitions/LoginCredentials"
      responses:
        "200":
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
        "401":
          description: "Invalid email or password"

definitions:
  CreateCustomerPayload:
    type: "object"
    required:
      - "name"
      - "email"
      - "phone"
      - "password"
    properties:
      name:
        type: "string"
        description: "The customer's full name."
        example: "Alex Morgan"
      email:
        type: "string"
        format: "email"
        description: "The customer's email address."
        example: "alex.morgan@example.com"
      phone:
        type: "string"
        description: "The customer's phone number."
        example: "555-0100"
      password:
        type: "string"
        format: "password"
        description: "The password for the customer account."
        example: "secret123"

  CreaterCustomerResponse:
    type: "object"
    required:
      - "id"
      - "name"
      - "email"
      - "phone"
    properties:
      id:
        type: "integer"
        format: "int32"
        description: "The newly created customer's ID."
        example: 1
      name:
        type: "string"
        description: "The customer's full name."
      email:
        type: "string"
        format: "email"
        description: "The customer's email address."
      phone:
        type: "string"
        description: "The customer's phone number."

  LoginCredentials:
    type: "object"
    required:
      - "email"
      - "password"
    properties:
      email:
        type: "string"
        format: "email"
        description: "The account email address."
        example: "customer@example.com"
      password:
        type: "string"
        format: "password"
        description: "The account password."
        example: "secret123"

  LoginResponse:
    type: "object"
    required:
      - "status"
      - "message"
      - "token"
    properties:
      token:
        type: "string"
        description: "Bearer JWT to use for authenticated requests."
      message:
        type: "string"
        description: "Result message for the login request."
      status:
        type: "string"
        description: "Login result status."
        example: "success"